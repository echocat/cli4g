version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      # CodeQL sub-actions must use the same version.
      codeql-actions:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action/*"
      codeql-actions-security:
        applies-to: "security-updates"
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/_examples/*"
      - "/_benchmarks"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    ignore:
      # Nested modules resolve cli4g through a local replace to this repository.
      - dependency-name: "github.com/echocat/cli4g"
    groups:
      go-modules:
        applies-to: "version-updates"
        group-by: "dependency-name"
        patterns:
          - "*"
